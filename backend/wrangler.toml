name = "sononghiatinh-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "sononghiatinh-db"
database_id = "ba32bcf2-eecd-48cd-ba5c-bf41dd89f9c1"

[durable_objects]
bindings = [
  { name = "GROUP_ROOM", class_name = "GroupRoomDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupRoomDO"]

[triggers]
crons = ["0 13 * * SUN"] # 20:00 VN time (UTC+7) = 13:00 UTC on Sunday
