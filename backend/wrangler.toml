name = "sononghiatinh-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
# Khóa công khai Web Push (VAPID). Khóa bí mật tương ứng: secret VAPID_PRIVATE_KEY (wrangler secret put)
VAPID_PUBLIC_KEY = "BC8jALLeLCPB4Ml0hAPQy4-Uc08wmMV0B5VJSsVKP1Xy-DVgxLpYrrzPBrjdsMIsgweYsyG9rtZdRGQIFJrJ0X0"
VAPID_SUBJECT = "https://sononghiatinh.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "sononghiatinh-db"
database_id = "ba32bcf2-eecd-48cd-ba5c-bf41dd89f9c1"

[durable_objects]
bindings = [
  { name = "GROUP_ROOM", class_name = "GroupRoomDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupRoomDO"]

[triggers]
crons = ["0 * * * *"] # Mỗi giờ: gửi nhắc nợ cho nhóm có lịch (thứ + giờ VN) trùng giờ hiện tại
