<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sổ Nợ Nghĩa Tình</title>

    <!-- Standard Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Web App / PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Safari & iPadOS PWA Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sổ Nợ" />
    <meta name="application-name" content="Sổ Nợ Nghĩa Tình" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f43f5e" />
    <meta name="msapplication-TileColor" content="#f43f5e" />
    <meta name="msapplication-TileImage" content="/apple-touch-icon-180x180.png" />

    <!-- iOS Safari Apple Touch Icons for all device resolutions -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png?v=4" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png?v=4" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png?v=4" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png?v=4" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Splash mở app: CSS inline để hiện tức thì, trước khi tải xong JS -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #f8fafc;
        background: radial-gradient(120% 80% at 50% 35%, color-mix(in srgb, var(--splash-accent, #f43f5e) 14%, #ffffff) 0%, #f8fafc 60%);
        transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1), transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      #splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .logo {
        width: 84px; height: 84px; border-radius: 24px;
        box-shadow: 0 18px 40px -12px color-mix(in srgb, var(--splash-accent, #f43f5e) 55%, transparent);
        animation: splash-pop 620ms cubic-bezier(0.34, 1.56, 0.64, 1) both, splash-float 2.4s ease-in-out 700ms infinite;
      }
      #splash .name {
        font-weight: 800; font-size: 17px; letter-spacing: -0.01em; color: #0f172a;
        animation: splash-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 180ms both;
      }
      #splash .bar {
        width: 72px; height: 4px; border-radius: 999px; overflow: hidden; background: #e2e8f0;
        animation: splash-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 300ms both;
      }
      #splash .bar::after {
        content: ''; display: block; width: 40%; height: 100%; border-radius: 999px;
        background: var(--splash-accent, #f43f5e);
        animation: splash-load 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splash-pop { 0% { opacity: 0; transform: scale(0.5) rotate(-8deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
      @keyframes splash-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes splash-load { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation: none !important; transition: opacity 150ms linear !important; }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-rose-500 selection:text-white min-h-screen">
    <div id="splash" aria-hidden="true">
      <img class="logo" src="/icons/icon-192.png" alt="" width="84" height="84" />
      <div class="name">Sổ Nợ Nghĩa Tình</div>
      <div class="bar"></div>
    </div>
    <script>
      // Splash theo màu chủ đạo người dùng đã chọn
      try {
        var hex = localStorage.getItem('tinhtien_user_theme_hex');
        if (hex && /^#[0-9a-f]{6}$/i.test(hex)) document.documentElement.style.setProperty('--splash-accent', hex);
      } catch (e) {}
      // Ẩn splash mượt; tối thiểu ~650ms để hiệu ứng không bị giật, tối đa 6s phòng khi mạng chậm
      (function () {
        var start = Date.now(), done = false;
        window.__hideSplash = function () {
          if (done) return; done = true;
          var el = document.getElementById('splash');
          if (!el) return;
          setTimeout(function () {
            el.classList.add('hide');
            document.documentElement.classList.add('app-ready');
            setTimeout(function () { el.remove(); }, 600);
          }, Math.max(0, 650 - (Date.now() - start)));
        };
        setTimeout(window.__hideSplash, 6000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
